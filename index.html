<!DOCTYPE html>
<html lang="ko">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>행맨 - 단어 맞히기</title>

      <link rel="stylesheet" href="css/style.css">
  </head>
  <body id="page">
    <div class="game">
      <h1>🔤 행맨 - 단어 맞히기</h1>

      <p class="hint" id="hint">힌트가 여기에 나옵니다.</p> 

      <p class="lives" id="lives">❤️❤️❤️❤️❤️❤️</p>

      <p class="word" id="wordDisplay">_ _ _ _ _</p>

      <p class="message" id="message">알파벳을 눌러 단어를 맞쳐 보세요!</p>

      <div class="keyboard" id="keyboard"></div>

      <button class="restart-btn" id="restartBtn">새 게임</button>
        
      <p class="score-text" id="scoreText">이긴 횟수 0 / 진 횟수 0</p>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
